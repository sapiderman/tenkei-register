<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi + HTMX Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 min-h-screen flex items-center justify-center font-sans text-slate-100">

    <div class="w-full max-w-md p-8 bg-slate-800/50 backdrop-blur-md border border-slate-700 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                Join the Squad
            </h1>
            <p class="text-slate-400 mt-2">Create your account to get started.</p>
        </div>

        <div id="form-container">
            {{ template "form" . }}
        </div>
    </div>

    {{ define "form" }}
    <form hx-post="/register" 
          hx-target="#form-container" 
          hx-swap="innerHTML" 
          class="space-y-5">
        
        {{ if .Error }}
        <div class="bg-red-500/10 border border-red-500/20 text-red-200 px-4 py-3 rounded-lg text-sm flex items-center gap-2 fade-in">
            <svg class="w-5 h-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
            {{ .Error }}
        </div>
        {{ end }}

        <div class="space-y-1">
            <label class="block text-sm font-medium text-slate-300">Email Address</label>
            <input type="email" name="email" value="{{ .Email }}" required
                   class="w-full bg-slate-900/50 border border-slate-600 rounded-lg px-4 py-2.5 text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-slate-600"
                   placeholder="you@domain.com">
        </div>

        <div class="space-y-1">
            <label class="block text-sm font-medium text-slate-300">Password</label>
            <input type="password" name="password" required
                   class="w-full bg-slate-900/50 border border-slate-600 rounded-lg px-4 py-2.5 text-slate-100 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder-slate-600"
                   placeholder="••••••••">
            <p class="text-xs text-slate-500">Must be at least 8 characters.</p>
        </div>

        <button type="submit" 
                class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-semibold py-3 rounded-lg shadow-lg shadow-blue-500/20 transition-all transform active:scale-95 flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
            <span>Create Account</span>
            <svg class="htmx-indicator w-5 h-5 animate-spin text-white/80" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
        </button>
    </form>
    {{ end }}

    {{ define "success" }}
    <div class="text-center py-8 fade-in">
        <div class="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h3 class="text-xl font-bold text-white mb-2">Welcome Aboard!</h3>
        <p class="text-slate-400 mb-6">We've sent a confirmation link to <br><span class="text-emerald-400">{{ .Email }}</span></p>
        <button onclick="location.reload()" class="text-sm text-slate-500 hover:text-slate-300 underline">
            Start Over
        </button>
    </div>
    {{ end }}

</body>
</html>
