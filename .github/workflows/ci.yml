name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: db_user
          POSTGRES_PASSWORD: db_password
          POSTGRES_DB: tenkei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TENKEI_DATABASE_CONNECTION_STRING: postgres://db_user:db_password@localhost:5432/tenkei_test?sslmode=disable
    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: go.mod

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Apply migrations
        run: |
          for f in ./migrations/*.up.sql; do
            psql "$TENKEI_DATABASE_CONNECTION_STRING" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          # bump deliberately with Go upgrades
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: Test
        run: go test ./... -race -covermode=atomic
