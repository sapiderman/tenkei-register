name: devcontainer-go-postgres

services:
  app:
    image: mcr.microsoft.com/devcontainers/go:1
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    # network_mode: service:db # TRICK: This lets 'app' talk to 'db' as if it were localhost
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - 5437:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: tenkei

volumes:
  postgres-data:
